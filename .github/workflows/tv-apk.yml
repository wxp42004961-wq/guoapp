name: Build TV test APK

on:
  push:
    branches: ['codex/tv-fixes-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: flutter pub get
      - name: Format source in build workspace
        run: dart format lib test integration_test test_driver
      - name: Analyze source
        run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - name: Configure signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build Hongguo-only APKs
        run: python scripts/build_android.py --abi armeabi-v7a --abi arm64-v8a
        env:
          TV_TEST_BUILD: 'true'
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: hongguojian-tv-test
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
